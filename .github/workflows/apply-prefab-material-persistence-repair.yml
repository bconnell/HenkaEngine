name: Apply Prefab Material Persistence Repair

on:
  push:
    branches:
      - repair/prefab-material-persistence
    paths:
      - .github/repair/apply_prefab_material_persistence.py
      - .github/workflows/apply-prefab-material-persistence-repair.yml

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/prefab-material-persistence
          fetch-depth: 0

      - name: Apply bounded source repair
        run: python .github/repair/apply_prefab_material_persistence.py

      - name: Validate repair diff
        shell: bash
        run: |
          git diff --check
          git status --short
          changed="$(git diff --name-only)"
          expected="$(printf '%s\n' \
            engine/include/henka/assets.h \
            engine/src/assets/assets.c \
            examples/sandbox3d/game_authoring.c \
            tests/test_sandbox3d_game_authoring.c)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected repair file set"
            printf 'Actual:\n%s\nExpected:\n%s\n' "$changed" "$expected"
            exit 1
          fi

      - name: Remove temporary branch repair machinery
        shell: bash
        run: |
          rm .github/repair/apply_prefab_material_persistence.py
          rm .github/workflows/apply-prefab-material-persistence-repair.yml
          rmdir .github/repair 2>/dev/null || true

      - name: Commit repair to branch
        shell: bash
        run: |
          git config user.name "Henka Repair Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            engine/include/henka/assets.h \
            engine/src/assets/assets.c \
            examples/sandbox3d/game_authoring.c \
            tests/test_sandbox3d_game_authoring.c \
            .github/repair/apply_prefab_material_persistence.py \
            .github/workflows/apply-prefab-material-persistence-repair.yml
          git diff --cached --check
          git commit -m "Fix Prefab material persistence integration"
          git push origin HEAD:repair/prefab-material-persistence
