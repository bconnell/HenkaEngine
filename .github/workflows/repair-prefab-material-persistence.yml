name: Finalize Prefab Material Persistence Repair

on:
  push:
    branches:
      - repair/prefab-material-persistence
    paths:
      - scripts/repair_prefab_material_persistence.py
      - .github/workflows/repair-prefab-material-persistence.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/prefab-material-persistence
          fetch-depth: 0

      - name: Apply guarded final repair and remove temporary helpers
        shell: pwsh
        run: python scripts/repair_prefab_material_persistence.py

      - name: Diff hygiene
        shell: powershell
        run: git diff --check

      - name: Prepare pinned software OpenGL fallback
        shell: powershell
        run: .\scripts\setup_windows_software_opengl.ps1 -TargetDirectory @("build\tests\Debug", "build\examples\sandbox3d\Debug")

      - name: Run focused Debug Game Authoring regression
        shell: powershell
        env:
          HENKA_CI_SOFTWARE_OPENGL_ROOT: ${{ github.workspace }}\build\ci\mesa3d-26.1.7\extracted\x64
          GALLIUM_DRIVER: llvmpipe
        run: .\scripts\test_windows.ps1 -Configuration Debug -TestFilter '^henka_sandbox3d_game_authoring_tests$'

      - name: Commit focused-green repair
        shell: powershell
        run: |
          git config user.name "Henka Repair Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Prefab material persistence integration"
          git push origin HEAD:repair/prefab-material-persistence
