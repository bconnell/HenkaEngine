name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    # The OpenGL integration suite requires a stable hosted image with the
    # declared desktop OpenGL baseline. Windows Server 2025 currently falls
    # back to a legacy context on hosted runners, so keep this job pinned until
    # that image provides a verified 3.3 core context.
    runs-on: windows-2022
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check repository wording
        shell: powershell
        run: .\scripts\check_public_repo_hygiene.ps1

      - name: Check public hygiene regression
        shell: powershell
        run: .\scripts\test_public_repo_hygiene_windows.ps1

      - name: Check documentation truth
        shell: powershell
        run: .\scripts\check_documentation_truth.ps1

      - name: Check documentation truth regression
        shell: powershell
        run: .\scripts\test_documentation_truth_windows.ps1

      - name: Check generic realism reference capture contract
        shell: powershell
        run: .\scripts\test_realism_reference_capture_windows.ps1

      - name: Check bounded PBR clearcoat response
        shell: powershell
        run: .\scripts\test_pbr_clearcoat_response_windows.ps1

      - name: Check scripting compiler authority
        shell: powershell
        run: .\scripts\check_scripting_authority.ps1

      - name: Check repository integrity
        shell: powershell
        run: .\scripts\check_repository_integrity.ps1

      - name: Build Debug
        shell: powershell
        run: .\scripts\build_windows.ps1 -Configuration Debug

      - name: Prepare pinned software OpenGL fallback
        shell: powershell
        run: .\scripts\setup_windows_software_opengl.ps1 -TargetDirectory @("build\tests\Debug", "build\examples\sandbox3d\Debug")

      - name: Check OpenGL capability
        shell: powershell
        run: .\scripts\test_opengl_capability_windows.ps1 -Configuration Debug

      - name: Run tests
        shell: powershell
        run: .\scripts\test_windows.ps1

      - name: Refresh Debug build provenance
        shell: powershell
        run: .\scripts\build_windows.ps1 -Configuration Debug

      - name: Build packaged sandbox
        shell: powershell
        run: .\scripts\package_sandbox3d_windows.ps1 -ResetUserData -Configuration Debug

      - name: Check packaged sandbox contract
        shell: powershell
        run: .\scripts\check_packaged_sandbox3d_windows.ps1 -NonInteractive -ContractOnly

      - name: Install CI-only OpenGL runtime for packaged smoke
        shell: powershell
        run: .\scripts\install_windows_software_opengl.ps1 -SourceDirectory "$env:HENKA_CI_SOFTWARE_OPENGL_ROOT" -TargetDirectory "out\HenkaSandbox3D"

      - name: Verify visible native modeling workflow
        shell: powershell
        run: .\scripts\test_visible_native_modeling_windows.ps1

      - name: Run bounded packaged soak
        shell: powershell
        run: .\scripts\soak_packaged_sandbox3d_windows.ps1 -Iterations 10

      - name: Run Release tests
        shell: powershell
        run: .\scripts\test_windows.ps1 -Configuration Release

      - name: Validate external game template
        shell: powershell
        run: .\scripts\test_external_game_template_windows.ps1 -NoLocalProviders

      - name: Validate external server template
        shell: powershell
        run: .\scripts\test_external_server_template_windows.ps1 -NoLocalProviders

      - name: Check generated output lifecycle
        shell: powershell
        run: .\scripts\check_generated_output_lifecycle_windows.ps1

  sanitizer-runtime:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run first-party sanitizer runtime gate
        shell: powershell
        run: .\scripts\test_sanitized_runtime_windows.ps1
